# Kitty — Catppuccin Mocha (mirrors ~/.config/alacritty/alacritty.toml)

font_family JetBrainsMono Nerd Font
font_size 12.0

# Alacritty padding x=8, y=4  →  kitty: left right top bottom
window_padding_width 8 8 4 4

# Catppuccin Mocha
background #1e1e2e
foreground #cdd6f4

# cursor (alacritty: text=#1e1e2e, cursor=#f5e0dc)
cursor #f5e0dc
cursor_text_color #1e1e2e

# selection (alacritty: text=#1e1e2e, background=#f5e0dc)
selection_background #f5e0dc
selection_foreground #1e1e2e

# normal
color0 #45475a
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #f5c2e7
color6 #94e2d5
color7 #bac2de

# bright
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8
