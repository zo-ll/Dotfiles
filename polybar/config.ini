[colors]
background = #2E3440
window-background = #DE2E3440
background-alt = #3B4252
border-color = #004C566A
foreground = #D8DEE9
primary = #88C0D0
secondary = #81A1C1
alert = #BF616A
disabled = #4C566A
nord0 = #2E3440
nord1 = #3B4252
nord2 = #434C5E
nord3 = #4C566A
nord4 = #D8DEE9
nord5 = #E5E9F0
nord6 = #ECEFF4
nord7 = #8FBCBB
nord8 = #88C0D0
nord9 = #81A1C1
nord10 = #5E81AC
nord11 = #BF616A
nord12 = #D08770
nord13 = #EBCB8B
nord14 = #A3BE8C
nord15 = #B48EAD

[bar/mybar]
monitor = DP-2
width = 100%
height = 20pt
radius = 5
fixed-center = true
background = ${colors.window-background}
foreground = ${colors.foreground}
line-size = 3pt
border-size = 2.5pt
border-color = ${colors.border-color}
padding-left = 0
padding-right = 0
module-margin = 2
separator = "|"
separator-foreground = ${colors.disabled}
font-0 = "JetBrains Mono:size=10;3"
font-1 = monospace;3
font-2 = "FiraCode Nerd Font:size=10;3"
font-3 = "Symbols Nerd Font:size=20;4"
modules-left = ewmh xwindow
modules-center = date
modules-right = pulseaudio microphone wlan bluetooth battery powerprofile logout
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/tray]
type = internal/tray
format = <tray>
format-margin = 5pt
tray-spacing = 8px
tray-padding = 0px
tray-size = 65%

[module/ewmh]
type = internal/xworkspaces
format = <label-state>
#group-by-monitor = false
#pin-workspaces = false
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-forground = #00000000
label-active-padding = 4
label-occupied = %name%
label-occupied-padding = 3
label-urgent = %name%
label-urgent-background = ${colors.primary}
label-urgent-padding = 3
label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 3


[module/xwindow]
type = internal/xwindow
label = %class:0:60:...%
label-maxlen = 20
padding = 5

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted = %{F#EBCB8B}%mountpoint%%{F-} %percentage_used%%
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix-foreground = ${colors.nord8}
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 2
label-volume = %percentage%%
use-ui-max = false
click-right = pavucontrol
label-muted = " Mute"
label-muted-foreground = ${colors.disabled}
format-muted = <label-muted>
format-muted-prefix = 󰝟
format-muted-prefix-font = 2
format-muted-padding = 2

; Ramp settings using <ramp-volume> used for Pulseaudio
ramp-volume-0 = 󰝟
ramp-volume-1 = "%{F#8FBCBB} "
ramp-volume-2 = "%{F#8FBCBB} "
ramp-volume-3 = "%{F#8FBCBB} "
ramp-volume-4 = "%{F#8FBCBB} "
ramp-volume-5 = "%{F#EBCB8B} "
ramp-volume-6 = "%{F#EBCB8B} "
ramp-volume-7 = "%{F#EBCB8B} "
ramp-volume-8 = "%{F#BF616A} "
ramp-volume-9 = "%{F#BF616A} "
ramp-volume-font = 2

[module/microphone]
type = custom/script
exec = ~/.config/polybar/mic.sh
interval = 2
format-padding = 2
click-left = ~/.config/polybar/mic.sh toggle

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = "%{F#D08770}%Y-%m-%d %H:%M:%S%{F-}"
label = %date%
label-font = 5
label-foreground = ${colors.nord13}
format = <label>

[module/wlan]
type = custom/script
exec = nmcli -t -f active,ssid dev wifi 2>/dev/null | grep '^yes' | cut -d: -f2 | awk '{if(length>0) print "%{T2}󰤨%{T-}   "$0; else print "%{T2}󰤭%{T-}   disconnected"}'
interval = 3
format-foreground = ${colors.nord14}
format-padding = 1
click-left = /home/az/.config/polybar/wifi.sh

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
format-charging = <label-charging>
format-charging-prefix = "󰢜 "
format-charging-prefix-font = 2
format-charging-prefix-foreground = ${colors.nord14}
format-charging-padding = 2
label-charging = "%percentage%%"
format-discharging = <ramp-capacity> <label-discharging>
format-discharging-padding = 2
label-discharging = "%percentage%%"
ramp-capacity-0 = "󰂎 "
ramp-capacity-0-font = 2
ramp-capacity-0-foreground = ${colors.alert}
ramp-capacity-1 = "󰁻 "
ramp-capacity-1-font = 2
ramp-capacity-1-foreground = ${colors.nord12}
ramp-capacity-2 = "󰁽 "
ramp-capacity-2-font = 2
ramp-capacity-2-foreground = ${colors.nord12}
ramp-capacity-3 = "󰂁 "
ramp-capacity-3-font = 2
ramp-capacity-3-foreground = ${colors.nord13}
ramp-capacity-4 = "󰂂 "
ramp-capacity-4-font = 2
ramp-capacity-4-foreground = ${colors.nord14}
format-full = <label-full>
format-full-prefix = "󰁹 "
format-full-prefix-font = 2
format-full-prefix-foreground = ${colors.nord14}
format-full-padding = 2
label-full = "%percentage%%"

[module/bluetooth]
type = custom/script
exec = if bluetoothctl show | grep -q "Powered: yes"; then echo "󰂯"; else echo "󰂲"; fi
interval = 5
format-foreground = ${colors.nord9}
format-padding = 2
click-left = blueman-manager

[module/logout]
type = custom/text
format = <label>
format-padding = 2
label = "%{F#ECEFF4} ⏻ %{F-}  "
click-left = xfce4-session-logout

[module/powerprofile]
type = custom/script
exec = ~/.config/polybar/power-profile.sh status
interval = 5
format-padding = 2
click-left = ~/.config/polybar/power-profile.sh

[settings]
screenchange-reload = true
pseudo-transparency = true

