set -g prefix M-q
set -g mouse on
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -g status-left-length 50
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# ── Clipboard sync ────────────────────────────────────────────────────────────
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"

# ── Status bar ────────────────────────────────────────────────────────────────
set -g status-style 'bg=green fg=black'
set -g status-interval 5
set -g status-justify left
set -g status-left '#[bold] #S #[default]│ '
set -g status-left-length 50
set -g status-right ' %H:%M  %d %b '
set -g window-status-format ' #I:#W '
set -g window-status-current-format '#[bold] #I:#W '
set -g window-status-separator ''

# ── Cheatsheet (Alt+q ?) ──────────────────────────────────────────────────────
bind ? display-popup -h 70% -w 50% "~/.config/tmux/scripts/tmux-cheatsheet"
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=green'
set -g pane-border-lines heavy
set -g main-pane-width 55%

# ── Pane navigation (global, no prefix) ─────────────────────────────────────
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# ── Window navigation (global, no prefix) ───────────────────────────────────
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-S-Left  previous-window
bind -n M-S-Right next-window

# ── Popup terminal (global, no prefix) ──────────────────────────────────────
bind -n M-f run-shell "~/.config/tmux/scripts/tmux-toggle-popup '#{session_name}' '#{pane_current_path}'"

# ── Window table (Alt+q w) ───────────────────────────────────────────────────
bind w switch-client -T window-table
bind -T window-table k confirm-before -p "kill window? (y/n)" kill-window
bind -T window-table q confirm-before -p "kill window? (y/n)" kill-window
bind -T window-table n new-window
bind -T window-table r command-prompt -I "#W" "rename-window '%%'"

# ── Session table (Alt+q s) ──────────────────────────────────────────────────
bind s switch-client -T session-table
bind -T session-table k display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-kill-session-picker"
bind -T session-table q display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-kill-session-picker"
bind -T session-table n command-prompt -p "session name:" "new-session -s '%%'"
bind -T session-table s display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-save-session-snapshot"
bind -T session-table p display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-restore-session-picker"
bind -T session-table r command-prompt -I "#S" "rename-session '%%'"
bind -T session-table l display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-switch-session-picker"
bind -T session-table d display-popup -E -h 50% -w 60% -d "#{pane_current_path}" \
    "~/.config/tmux/scripts/tmux-delete-snapshot-picker"

# ── Pane table (Alt+q p) ─────────────────────────────────────────────────────
bind p switch-client -T pane-table
bind -T pane-table k kill-pane
bind -T pane-table q kill-pane
bind -T pane-table n run-shell "~/.config/tmux/scripts/tmux-split-stack"
bind -T pane-table z resize-pane -Z
bind -T pane-table r switch-client -T resize-table

# ── Resize table (Alt+q p r, loops until Escape) ────────────────────────────
bind -T resize-table h     resize-pane -L 5 \; switch-client -T resize-table
bind -T resize-table j     resize-pane -D 5 \; switch-client -T resize-table
bind -T resize-table k     resize-pane -U 5 \; switch-client -T resize-table
bind -T resize-table l     resize-pane -R 5 \; switch-client -T resize-table
bind -T resize-table Left  resize-pane -L 5 \; switch-client -T resize-table
bind -T resize-table Down  resize-pane -D 5 \; switch-client -T resize-table
bind -T resize-table Up    resize-pane -U 5 \; switch-client -T resize-table
bind -T resize-table Right resize-pane -R 5 \; switch-client -T resize-table
bind -T resize-table Escape switch-client -T root
